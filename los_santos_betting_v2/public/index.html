<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davis Liquor - Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Arka plan olarak dükkanın içini kullanacağız -->
    <div class="store-background"></div>

    <div class="game-container">
        
        <!-- TEZGAHTAR VE DİYALOG (Papers, Please Tarzı) -->
        <div class="clerk-section">
            <div class="clerk-portrait">
                <!-- Oyuncunun verdiği tezgahtar fotoğrafı -->
                <img src="clerk.png" alt="Clerk" id="clerkImg">
            </div>
            <div class="dialog-box">
                <p id="clerkText">Ne istiyorsun? IC aldığın biletin veya at kuponunun kodunu söyle.</p>
                <div class="input-area" id="inputArea">
                    <input type="text" id="ticketCode" placeholder="Örn: K-1234 veya A-5678" autocomplete="off">
                    <button onclick="submitCode()">VER</button>
                </div>
            </div>
        </div>

        <!-- OYUN ALANI (Masa ve Monitör) -->
        <div class="interaction-area">
            
            <!-- KAZI KAZAN MASASI -->
            <div id="deskArea" class="hidden">
                <div class="desk-surface">
                    <h3 class="retro-title">Masa (Kazı Kazan)</h3>
                    <div class="ticket-container">
                        <div class="ticket-background" id="ticketResult">
                            <span id="winAmount">BİLET BEKLENİYOR</span>
                        </div>
                        <canvas id="scratchCanvas" width="350" height="180"></canvas>
                    </div>
                </div>
            </div>

            <!-- TÜPLÜ MONİTÖR (Inside Track) -->
            <div id="crtArea" class="hidden">
                <div class="crt-monitor">
                    <div class="crt-screen">
                        <div class="scanlines"></div>
                        <h3 class="retro-title crt-text">INSIDE TRACK</h3>
                        <div id="race-status" class="crt-text">Yarış Bekleniyor...</div>
                        <p id="player-bet-info" class="crt-text" style="color:#2ecc71; font-size:10px;"></p>
                        
                        <div class="track crt-track">
                            <div class="horse-lane" id="lane-1"><span class="horse-name">1. Bleeder</span><div class="sprite">🐎</div></div>
                            <div class="horse-lane" id="lane-2"><span class="horse-name">2. Hennigan's</span><div class="sprite">🐎</div></div>
                            <div class="horse-lane" id="lane-3"><span class="horse-name">3. Pisswasser</span><div class="sprite">🐎</div></div>
                            <div class="horse-lane" id="lane-4"><span class="horse-name">4. Yellow Jack</span><div class="sprite">🐎</div></div>
                            <div class="horse-lane" id="lane-5"><span class="horse-name">5. Leonida</span><div class="sprite">🐎</div></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
